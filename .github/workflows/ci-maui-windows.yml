name: CI - MAUI (Windows)

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build and test on Windows (.NET 10)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.202'

      - name: Install .NET 10 SDK (runtime install) 
        shell: pwsh
        run: Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -OutFile 'dotnet-install.ps1' .\dotnet-install.ps1 -Version 10.0.202 -InstallDir "$env:RUNNER_TEMP\dotnet" Add-Content -Path $env:GITHUB_ENV -Value "DOTNET_ROOT=$env:RUNNER_TEMP\dotnet" Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\dotnet" dotnet --info

      - name: Install MAUI workload
        run: dotnet workload install maui-windows maui-ios maui-android maui-maccatalyst

      - name: Restore MAUI workloads
        run: dotnet workload restore
        working-directory: Copilot.MAUI

      - name: Restore NuGet packages
        run: dotnet restore Copilot.MAUI.sln --runtime win-x64
        working-directory: Copilot.MAUI

      - name: Build solution
        run: dotnet build Copilot.MAUI.sln --configuration Release --no-restore --runtime win-x64
        working-directory: Copilot.MAUI

      - name: Run unit tests
        run: dotnet test Copilot.MAUI.sln --configuration Release --no-build --verbosity normal --runtime win-x64
        working-directory: Copilot.MAUI
